<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f3f0" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#0f1011" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a forced appearance before first paint; see src/client/shared/theme.ts.
      try {
        var theme = localStorage.getItem('setrai-theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
          var color = theme === 'dark' ? '#0f1011' : '#f3f3f0'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) { meta.content = color })
        }
      } catch (error) { /* Storage unavailable: follow the device. */ }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Setrai" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Setrai is a self-hosted training app for exercises, workouts, home progress, and recovery."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/setrai-icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/setrai-icon-180.png" sizes="180x180" />
    <title>Setrai</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/client/app/main.ts"></script>
  </body>
</html>
